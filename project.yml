name: NotchApp
options:
  bundleIdPrefix: com.erwinzhang
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.6.1"
    CURRENT_PROJECT_VERSION: "18"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "NotchApp Dev"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0

targets:
  NotchApp:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
      - path: LICENSE
        buildPhase: resources
        type: file
      - path: NOTICE
        buildPhase: resources
        type: file
      - path: Vendor/MediaRemoteAdapter/mediaremote-adapter.pl
        buildPhase: resources
        type: file
      - path: Vendor/MediaRemoteAdapter/MediaRemoteAdapterTestClient
        buildPhase: resources
        type: file
      - path: Vendor/MediaRemoteAdapter/MediaRemoteAdapter-LICENSE.txt
        buildPhase: resources
        type: file
    dependencies:
      # Bundled but NOT linked. The framework is loaded at runtime by the
      # Perl adapter script (mediaremote-adapter.pl), not by our binary.
      - framework: Vendor/MediaRemoteAdapter/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erwinzhang.NotchApp
        PRODUCT_NAME: NotchApp
        INFOPLIST_KEY_LSUIElement: YES
        # Required for Apple Events / Automation. Without this, hardened
        # runtime hard-denies AppleScript control of other apps with no
        # consent prompt shown — which is why Spotify seek was silently
        # erroring with -1743.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "NotchApp controls media players like Spotify so you can scrub the playback position from the notch."
        # EventKit (Calendar + Reminders). Required on macOS 14+; without
        # these the system silently denies the request rather than prompting.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "NotchApp displays your upcoming calendar events in the Ambient tab."
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: "NotchApp displays your scheduled reminders in the Ambient tab."
        # IOBluetooth connect / disconnect notifications. macOS 14+ treats
        # any IOBluetooth API access as privacy-sensitive even though we
        # only ask "is something paired and connected" — no scanning, no
        # data transfer. Without this key, IOBluetoothDevice.register(...)
        # hard-crashes the process on first call.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "NotchApp shows a notch activity when Bluetooth devices like AirPods connect."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Erwin Zhang. GNU GPL v3."
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        GENERATE_INFOPLIST_FILE: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: Resources/NotchApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Required when signed with our self-signed "NotchApp Dev" identity
        # under hardened runtime: Xcode's debug dylibs (libMainThreadChecker,
        # libBacktraceRecording, etc.) are Apple-signed, and without this
        # entitlement dyld refuses to load them — process dies at launch
        # with `dyld4::halt → abort_with_payload`. Safe for release too;
        # we don't load arbitrary plugins.
        com.apple.security.cs.disable-library-validation: true
        # Lets the Xcode debugger attach to the running process. Auto-added
        # by Xcode for Debug builds when using Apple-issued identities, but
        # not for self-signed — declare it explicitly.
        com.apple.security.get-task-allow: true
        # Pair to NSAppleEventsUsageDescription above. Required by hardened
        # runtime to send Apple events to other apps. Non-sandbox variant —
        # one switch covers all targets; no per-app temporary-exception.
        com.apple.security.automation.apple-events: true
        # EventKit access — not strictly required in non-sandboxed apps
        # (Info.plist keys suffice), but harmless and keeps the bundle
        # portable to sandboxed builds in the future.
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.reminders: true
